<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publisher — Becoming, by Stan</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="index.html">Becoming<span>, by Stan</span></a><nav><a href="index.html">View site</a></nav></header>
<main class="admin"><p class="eyebrow">Publisher</p><h1>Create a story</h1>
<p class="notice">This starter publisher saves stories in this browser. The next step is connecting it to a free hosted CMS so you can publish publicly from anywhere.</p>
<form id="story-form">
<label>Title<input id="title" required></label><label>Subtitle<input id="subtitle"></label>
<label>Category<select id="category"><option>Fashion</option><option>Cinema</option><option>Music</option><option>Art</option><option>World</option><option>Essays</option><option>Notes</option></select></label>
<label>Cover image URL<input id="image" placeholder="https://..."></label><label>Date<input id="date" type="date"></label>
<label>Excerpt<textarea id="excerpt"></textarea></label><label>Article body<textarea id="body" rows="14" placeholder="Write your article here..."></textarea></label>
<button class="button" type="submit">Save story</button></form><h2>Your browser stories</h2><div id="drafts"></div></main>
<footer><span>Becoming, by Stan</span><a href="index.html">View site</a></footer><script src="script.js"></script></body></html>
